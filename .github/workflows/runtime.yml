# Tests the Python packages, then builds the machine images and pushes them to GHCR:
#   ghcr.io/janos95/tule-runtime:cpu   and :sha-<short>-cpu    (runtime/Dockerfile, Cloudflare Containers)
#   ghcr.io/janos95/tule-runtime:cuda  and :sha-<short>-cuda   (runtime/Dockerfile.cuda, RunPod pods)
name: runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "python/**"
      - "cli/**"
      - "skills/**"
      - "templates/**"
      - "tools/build_agents_md.py"
      - ".dockerignore"
      - ".github/workflows/runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            cli/pyproject.toml
      - name: System libraries (OCP loads libGL.so.1)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libx11-6
      - run: pip install -e "python[test]" -e "cli[test]"
      - run: python -m pytest -q python cli

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            dockerfile: runtime/Dockerfile
            check: import OCP, tule, tule_cli, PIL
          - flavor: cuda
            dockerfile: runtime/Dockerfile.cuda
            check: import OCP, tule, tule_cli, PIL, scipy, cupy
    env:
      IMAGE: ghcr.io/janos95/tule-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the CUDA image is about 4 GB unpacked)
        if: matrix.flavor == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ matrix.flavor }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
      - name: Smoke test (imports, tule docs, a labeled screenshot)
        run: |
          docker run --rm --entrypoint python "$IMAGE:${{ matrix.flavor }}" -c "${{ matrix.check }}; print('imports ok')"
          docker run --rm --entrypoint tule "$IMAGE:${{ matrix.flavor }}" docs
          docker run --rm -v "$PWD/examples:/examples:ro" -e TULE_OUTPUTS=/tmp/outputs --entrypoint sh "$IMAGE:${{ matrix.flavor }}" \
            -c "python /examples/bracket.py && tule screenshot -o /tmp/view.png --labels"
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.flavor }}
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short }}-${{ matrix.flavor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
