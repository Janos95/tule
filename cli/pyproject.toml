[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tule-cli"
version = "0.1.0"
description = "The tule command: start Tule machines, SSH into them, open the viewer"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["websockets>=13"]

[project.scripts]
tule = "tule_cli:main"

[tool.setuptools.packages.find]
include = ["tule_cli*"]
