[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tule-cli"
version = "0.1.0"
description = "The tule command: start Tule machines, SSH into them, open the viewer, render and inspect outputs"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["websockets>=13"]

[project.optional-dependencies]
# tule screenshot / inspect also need the tule modeling package (python/)
render = ["numpy>=1.24", "pillow>=10.1"]
test = ["numpy>=1.24", "pillow>=10.1", "pytest>=8"]

[project.scripts]
tule = "tule_cli:main"
# git with a Tule project as the remote (tule_cli/gitremote.py)
git-remote-tule = "tule_cli.gitremote:main"
git-credential-tule = "tule_cli.gitremote:credential"

[tool.setuptools.packages.find]
include = ["tule_cli*"]
