[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tule"
version = "0.1.0"
description = "Pythonic solid modeling on OpenCascade, built for agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "cadquery-ocp>=7.8",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "python-fcl>=0.7",  # clearance: mesh distances
  "manifold3d>=3.1",  # mesh Booleans, ray casts (tule.Mesh)
]

[project.optional-dependencies]
test = ["pytest>=8", "trimesh>=4", "lxml", "networkx"]   # trimesh reads 3MF plates back
gpu = ["cupy-cuda12x>=13"]   # tule.topopt on NVIDIA GPUs (device="auto" picks it up)

[tool.setuptools.packages.find]
include = ["tule*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
