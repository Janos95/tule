[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tule"
version = "0.1.0"
description = "Pythonic solid modeling on OpenCascade, built for agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "cadquery-ocp>=7.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tule*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
