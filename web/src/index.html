<!doctype html>
<html lang="en" class="light-only">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tule</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <aside id="outputs" aria-label="Outputs">
        <div class="project-head">
          <a class="back" href="/" title="Your projects"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>Projects</a>
          <div id="project-name" class="project-name"></div>
        </div>
        <div class="outputs-head">Outputs</div>
        <div id="tab-outputs" class="side-pane">
          <div id="output-list" role="listbox" aria-label="Outputs"></div>
          <div id="parts" role="tree" aria-label="Parts" hidden></div>
          <p id="outputs-empty" class="outputs-empty" hidden>Nothing in <code>outputs/</code> yet. Write a STEP or STL file to <code>/workspace/outputs/&lt;name&gt;/</code> on the machine.</p>
        </div>
        <div class="side-foot"><span id="machine" class="machine" data-state="unknown" title="The project's machine"><span class="dot"></span><span id="machine-text">connecting…</span><svg id="machine-more" class="chev" viewBox="0 0 24 24" hidden><path d="M6 9l6 6l6 -6"/></svg><select id="machine-pick" aria-label="Which machine's copy to show" hidden></select></span></div>
      </aside>
      <section id="right">
        <div id="stage">
          <div id="viewer"></div>
          <div id="hud" class="hud">
            <button id="annotate-toggle" class="toggle" title="Annotate: draw and pick faces for your agent" aria-controls="annotate" aria-expanded="false">
              <svg viewBox="0 0 16 16"><path d="M10.5 2.5l3 3-8 8H2.5v-3zM9 4l3 3" /></svg><span class="label">Annotate</span>
            </button>
            <div class="dl">
              <button id="download" type="button" title="Download this output's files" aria-haspopup="menu" aria-expanded="false" hidden>
                <svg viewBox="0 0 16 16"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13.5h10" /></svg><span class="label">Download</span>
              </button>
              <div id="download-menu" class="menu" role="menu" hidden></div>
            </div>
            <button id="fit" title="Fit view (F, or double-click)">
              <svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" /></svg>Fit
            </button>
          </div>
          <div id="marks" aria-hidden="true"></div>
          <canvas id="ink" aria-hidden="true"></canvas>
          <div id="annot-shown" class="annot-shown" hidden><span id="annot-shown-text"></span><button id="annot-shown-hide" type="button">Hide</button></div>
          <div id="annotate" class="annot" aria-label="Annotate" hidden>
            <div class="annot-head"><b>Annotate for your agent</b><button id="annot-close" class="close" type="button" aria-label="Close">×</button></div>
            <div class="annot-tools">
              <div class="seg" role="group" aria-label="Tool">
                <button id="annot-draw" type="button" aria-pressed="true">Draw</button>
                <button id="annot-pick" type="button" aria-pressed="false">Pick faces</button>
              </div>
              <div id="annot-colors" class="ink-colors"></div>
              <span class="annot-gap"></span>
              <button id="annot-undo" type="button" title="Undo the last stroke (⌘Z)">Undo</button>
              <button id="annot-clear" type="button" title="Remove strokes and picks">Clear</button>
            </div>
            <p id="annot-hint" class="annot-hint"></p>
            <form id="annot-label-form" class="annot-label-row" hidden>
              <input id="annot-label" list="annot-labels" placeholder="fixed, load 500 N down, …" aria-label="Label for the selected faces" autocomplete="off" />
              <button id="annot-label-add" type="submit">Label</button>
            </form>
            <datalist id="annot-labels"><option value="fixed"></option><option value="load"></option><option value="keep"></option><option value="remove"></option><option value="too thin"></option><option value="round this"></option></datalist>
            <div id="annot-picks"></div>
            <textarea id="annot-note" rows="2" placeholder="Note for your agent (optional)"></textarea>
            <div class="annot-save"><button id="annot-save" class="primary" type="button">Save</button><span id="annot-why"></span></div>
            <div id="annot-done" class="annot-done" hidden>
              <div>Saved to <code></code></div>
              <div class="annot-tell"><span>Tell your agent:</span><button id="annot-copy" type="button">Copy</button></div>
              <q class="annot-say"></q>
              <small class="annot-summary"></small>
            </div>
            <details id="annot-past" hidden>
              <summary>Earlier annotations (<span id="annot-past-count"></span>)</summary>
              <div id="annot-past-list"></div>
            </details>
          </div>
          <div id="caption" class="caption" hidden></div>
          <div id="status" class="status"></div>
          <div id="pick" class="pick-label" hidden></div>
          <div id="counts"></div>
        </div>
        <div id="strip" class="strip" hidden><div id="legend" class="legend" aria-label="About this output" hidden></div></div>
        <footer id="sequence" hidden>
          <div id="plot" class="plot" aria-label="The frames' values" hidden></div>
          <div class="seq-row">
            <button id="play" title="Play the frames" aria-label="Play the frames"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" /></svg></button>
            <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame" />
            <span id="frame"></span>
            <span id="live" class="live" title="output.json says more frames are coming" hidden>running</span>
          </div>
        </footer>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
